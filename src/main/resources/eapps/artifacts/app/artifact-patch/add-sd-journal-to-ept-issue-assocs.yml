---
id: add-sd-journal-to-ept-issue-assocs
name:
  ru: Добавить журнал SD заявок к ассоциациям blocks и relates-to в типе ept-issue
  en: Add SD requests journal to blocks and relates-to associations in ept-issue type

target: 'model/type$ept-issue'

type: json
config:
  operations:
    - op: add
      path: '$.associations[?(@.id == "blocks")].journals'
      value: uiserv/journal@sd-request-links-journal
    - op: add
      path: '$.associations[?(@.id == "relates-to")].journals'
      value: uiserv/journal@sd-request-links-journal
