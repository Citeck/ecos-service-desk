---
id: restrict-sd-assoc-journals
name:
  ru: Ограничить журналы в ассоциации "Связан с" для SD
  en: Restrict journals in "Connected with" association for SD

target: 'model/type$sd-request-type'

type: json
config:
  operations:
    - op: add
      path: '$.associations'
      value:
        id: "assoc:associatedWith"
        journalsFromTarget: false
        direction: BOTH
        journals:
          - uiserv/journal@all-requests-service-desk-journal
          - uiserv/journal@ecos-release-journal
          - uiserv/journal@ept-sprint-journal
          - uiserv/journal@ept-issue-journal
